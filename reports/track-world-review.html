<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track surface and architecture — local renderer fixture</title>
<style>body{margin:0;background:#110017;color:white;font:13px system-ui}header{position:fixed;top:12px;left:12px;z-index:1;padding:12px;background:#110017dc;max-width:760px}button,select{font:inherit;padding:8px;margin:4px;background:#fff;color:#110017;border:0}output{display:block;margin-top:7px}canvas{display:block}b{color:#fff71e}</style>
<header><b>Local world renderer fixture — not a gameplay test</b><div><select id="track"></select><button id="previous">Earlier sector</button><button id="next">Next sector</button><button id="view">Chase / overview</button><button id="quality">Mobile / desktop</button></div><output id="status">Loading</output></header>
<script type="module">
import * as T from 'three';import {createWorld} from '/src/world.js';import {TRACKS,setTrack,sampleTrack} from '/src/track.js';
const params=new URLSearchParams(location.search);if(params.has('photo'))document.querySelector('header').hidden=true;
const id=params.get('track')||'harbor',low=params.get('low')!=='0',sector=Number(params.get('sector')||.13),over=params.has('overview');
setTrack(id);const errors=[];window.trackReview={errors,ready:false};addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});const viewWidth=params.has('capture')?960:innerWidth,viewHeight=params.has('capture')?540:innerHeight;renderer.setSize(viewWidth,viewHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFShadowMap;document.body.append(renderer.domElement);
const world=createWorld(renderer,{low,reducedMotion:true}),track=setTrack(id),p=sampleTrack(track.length*sector),ahead=sampleTrack(track.length*sector+38),camera=new T.PerspectiveCamera(52,viewWidth/viewHeight,.1,1900);
world.update(0,{x:p.x,y:p.y,z:p.z,speed:0},{paused:false,reducedMotion:true});
const move=(value)=>{params.set('sector',((value%1)+1)%1);location.search=params};document.querySelector('#previous').onclick=()=>move(sector-.10);document.querySelector('#next').onclick=()=>move(sector+.10);document.querySelector('#view').onclick=()=>{params.has('overview')?params.delete('overview'):params.set('overview','1');location.search=params};document.querySelector('#quality').onclick=()=>{params.set('low',low?'0':'1');location.search=params};
const select=document.querySelector('#track');for(const t of TRACKS){const o=document.createElement('option');o.value=t.id;o.textContent=t.name;select.append(o)}select.value=id;select.onchange=()=>{params.set('track',select.value);location.search=params};
camera.position.set(p.x-p.tx*(over?38:8)+p.nx*(over?28:0),p.y+(over?28:2.8),p.z-p.tz*(over?38:8)+p.nz*(over?28:0));camera.lookAt(over?p.x:ahead.x,over?p.y:p.y+1.5,over?p.z:ahead.z);
const snapshot=()=>({track:id,low,sector,draws:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,surfaces:world.surfaces.status,sky:world.backdrop.status,trees:world.trees?.status,detail:world.scene.userData.trackWorldDetail,glError:renderer.getContext().getError()});
let frame=0;renderer.setAnimationLoop(()=>{world.update(6,{x:p.x,y:p.y,z:p.z,speed:0},{paused:false,reducedMotion:true});renderer.render(world.scene,camera);if(++frame%30===0){window.trackReview.stats=snapshot();document.querySelector('#status').textContent=`${track.name} · ${low?'mobile':'desktop'} · ${world.surfaces.status.loaded}/${world.surfaces.status.files} maps · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles · ${errors.length} errors`;}});
await Promise.all([world.surfaces.ready,world.backdrop.ready,world.trees?.ready]);await renderer.compileAsync(world.scene,camera);
// Actual GPU sampling proves loaded Image objects have replaced neutral
// placeholders. A loaded-count alone would not establish rendered detail.
const target=new T.WebGLRenderTarget(128,128),proofScene=new T.Scene(),proofCamera=new T.OrthographicCamera(-1,1,1,-1,.1,2);proofCamera.position.z=1;
const proofGeometry=new T.PlaneGeometry(2,2),pixels=new Uint8Array(128*128*4),proof=[];
for(const [name,map]of Object.entries(world.surfaces.maps)){
 const material=new T.MeshBasicMaterial({map,toneMapped:false}),mesh=new T.Mesh(proofGeometry,material);proofScene.add(mesh);renderer.setRenderTarget(target);renderer.render(proofScene,proofCamera);renderer.readRenderTargetPixels(target,0,0,128,128,pixels);
 let min=255,max=0,sum=0,sum2=0;for(let i=0;i<pixels.length;i+=4){const v=pixels[i];min=Math.min(min,v);max=Math.max(max,v);sum+=v;sum2+=v*v;}const n=pixels.length/4;
 proof.push({name,width:map.image.width,height:map.image.height,gpuRedMin:min,gpuRedMax:max,gpuRedMean:sum/n,gpuRedStdDev:Math.sqrt(sum2/n-(sum/n)**2)});proofScene.remove(mesh);material.dispose();
}
renderer.setRenderTarget(null);target.dispose();proofGeometry.dispose();window.trackReview.textureProof=proof;
// Keep asset/LOD selection active with motion frozen; paused updates skip crowd selection.
// Six near/middle/far variants must all finish. The final far request starts
// only after its motion palette resolves, so 18 loaded requests also cover all
// six palettes; a brief idle gap between sequential variants is not readiness.
await new Promise((resolve,reject)=>{const started=performance.now();let settled=0;function check(){world.update(6,{x:p.x,y:p.y,z:p.z,speed:0},{paused:false,reducedMotion:true});const loading=world.scene.userData.crowd?.assetLoading;const done=loading&&loading.requested===18&&loading.loaded===18&&loading.active===0&&loading.queued===0;settled=done?settled+1:0;if(settled>=3)return resolve();if(performance.now()-started>45000)return reject(Error('Crowd assets did not settle before capture'));requestAnimationFrame(check);}check();});
window.trackReview.ready=true;window.trackReview.world=world;window.trackReview.camera=camera;window.trackReview.renderer=renderer;document.querySelector('#status').dataset.ready='true';
if(params.has('capture')){renderer.setAnimationLoop(null);renderer.render(world.scene,camera);window.trackReview.stats=snapshot();}
addEventListener('pagehide',()=>{world.disposeSurfaceTextures();world.disposeCrowd?.();world.backdrop.dispose();world.disposeEnvironment();renderer.dispose()});
</script></html>
