<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Textured spectators — actual renderer review</title><style>html,body{margin:0;background:#dbe1e2;font-family:system-ui}canvas{display:block;width:100vw;height:100vh}#tools{position:absolute;left:12px;top:12px;background:#ffffffe8;padding:12px;max-width:650px}button,select{min-height:38px;margin:3px}#status{font-size:13px}</style></head><body><div id="tools"><select id="look"><option value="-1">All six adults</option></select><button id="shade">Fabric shade: varied</button><button id="pose">Change gesture</button><button id="seated">Standing / seated</button><button id="pause">Pause</button><button id="face">Face detail</button><button id="wide">Whole group</button><div id="status">Loading six textured rigs</div></div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createSpectatorLibrary,createTexturedSpectator,SPECTATOR_ASSETS} from '/src/realistic-spectator.js';
import {spectatorProfile,spectatorPose} from '/src/crowd.js';
import {SPECTATOR_GESTURES} from '/src/spectator-motion-config.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color('#dbe1e2');s.add(new THREE.HemisphereLight('#e8f3ff','#64523c',2));const l=new THREE.DirectionalLight('#fff1dc',3);l.position.set(2,4,3);s.add(l);const fill=new THREE.DirectionalLight('#bedfff',1);fill.position.set(-2,2,-3);s.add(fill);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.02,100);camera.position.set(0,2.1,10);const controls=new OrbitControls(camera,r.domElement);controls.target.set(0,1,0);controls.update();
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#adb6b7',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;s.add(floor);
let selected=-1,shade=-1,gesture=0,seated=false,paused=false,time=0,last=performance.now();const characters=[];
const library=createSpectatorLibrary();const select=document.querySelector('#look');SPECTATOR_ASSETS.forEach((a,i)=>select.add(new Option(a.id,i)));
await Promise.all(SPECTATOR_ASSETS.map(async(a,i)=>{const source=await library.get(i);if(!source)throw new Error('Failed '+a.id);const character=createTexturedSpectator(source);characters[i]=character;s.add(character.mesh);}));
function layout(){characters.forEach((character,i)=>{character.mesh.visible=selected<0||selected===i;});}layout();
document.querySelector('#shade').onclick=()=>{shade=(shade+1)%8;document.querySelector('#shade').textContent=`Fabric shade: ${shade+1}/8`;};
select.onchange=()=>{selected=Number(select.value);layout();};document.querySelector('#pose').onclick=()=>gesture=(gesture+1)%SPECTATOR_GESTURES.length;document.querySelector('#seated').onclick=()=>seated=!seated;document.querySelector('#pause').onclick=()=>paused=!paused;
document.querySelector('#face').onclick=()=>{if(selected<0){selected=0;select.value='0';layout();}camera.position.set(.25,1.53,1.05);controls.target.set(0,1.42,0);controls.update();};document.querySelector('#wide').onclick=()=>{camera.position.set(0,2.1,10);controls.target.set(0,1,0);controls.update();};
window.spectatorReview={snapshot:()=>({shade,gesture,seated,paused,draws:r.info.render.calls,triangles:r.info.render.triangles,programs:r.info.programs.map(p=>({runnable:p.diagnostics?.runnable??null})),glError:r.getContext().getError()})};
function draw(now){requestAnimationFrame(draw);const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)time+=dt;
characters.forEach((character,i)=>{const person={...spectatorProfile(selected<0?(i-2.5)*1.05:0,0,0,0,seated,()=>.5),...SPECTATOR_ASSETS[i],gesture:selected<0?(i+gesture)%SPECTATOR_GESTURES.length:gesture,phase:shade<0?i*.75:(shade+.1)/11.37,width:1,height:1};character.update(person,spectatorPose(person,time,.9));});
r.render(s,camera);document.querySelector('#status').textContent=`${characters.length} textured CC0 adults · ${r.info.render.calls} draws · ${r.info.render.triangles.toLocaleString()} triangles · pose ${gesture} · ${seated?'seated':'standing'} · ${paused?'paused':'animated'}`;}requestAnimationFrame(draw);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});addEventListener('pagehide',()=>{for(const character of characters)character.dispose();library.dispose();});
</script></body></html>
